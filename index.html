<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ふるいちラボ"><meta name="theme-color" content="#fff100"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-512.png"><link rel="manifest" href="manifest.webmanifest">
<title>ふるいちラボ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
</head><body>
<style>
/* D案「ふるいち黄」: 公式ロゴの黄 #FFF100・黒・落款の朱 #D92626。地色は和紙風の薄いグレー */
:root{
  --bg:#e8e3de;
  --surface:#ffffff;
  --surface-2:#e8e3de;
  --fg:#111111;
  --muted:#5c5752;
  --ink:#111111;
  --line:#d5d0ca;
  --brand:#fff100;
  --hot:#d92626;
  --hot-soft:#fbe1e1;
  --cold:#2f6cc2;
  --cold-soft:#e1ebf9;
  --ok:#2e7d4f;
  --ok-soft:#dff0e4;
  --ng:#d92626;
  --ng-soft:#fbe1e1;
  --warn:#b7791f;
  --warn-soft:#fbeccb;
  --btn:#fff100;
  --btn-fg:#111111;
  --shadow:6px 6px 0 #fff100;
  --font-display:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a17;--surface:#262420;--surface-2:#2f2d25;--fg:#efece2;--muted:#a7a394;--ink:#efece2;--line:#3d3a30;
    --hot:#f06a50;--hot-soft:#4a2419;--cold:#6d9ee8;--cold-soft:#1d2e4a;
    --ok:#5fc287;--ok-soft:#1d3a2a;--ng:#f07a6e;--ng-soft:#4a1f1b;--warn:#e0a84a;--warn-soft:#45351a;
    --shadow:6px 6px 0 #c9bd00;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a17;--surface:#262420;--surface-2:#2f2d25;--fg:#efece2;--muted:#a7a394;--ink:#efece2;--line:#3d3a30;
  --hot:#f06a50;--hot-soft:#4a2419;--cold:#6d9ee8;--cold-soft:#1d2e4a;
  --ok:#5fc287;--ok-soft:#1d3a2a;--ng:#f07a6e;--ng-soft:#4a1f1b;--warn:#e0a84a;--warn-soft:#45351a;
  --shadow:6px 6px 0 #c9bd00;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.move-banner{display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:var(--brand);color:#111;border-bottom:3px solid #111;font-size:13px;line-height:1.5}.move-banner a{align-self:flex-start;background:#111;color:var(--brand);padding:8px 14px;border-radius:6px;font-weight:900;text-decoration:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);margin-inline:-16px;padding-inline:16px;padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink)}
header.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
header.top .logo{height:40px;width:auto;flex:none;display:block}
header.top h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.06em;white-space:nowrap;padding:2px 8px;border:2px solid var(--ink);border-radius:4px;background:var(--brand);color:#111111;line-height:1.2}
header.top .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
header.top .who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);font-weight:700}
header.top .who button{font-size:11px;font-weight:700;color:var(--fg);border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px}
main{padding-block:14px 0}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding-inline:5px;border-radius:3px;font-size:12px;font-weight:700;line-height:1;color:#fff}
.badge.hot{background:var(--hot)}.badge.cold{background:var(--cold)}
.abbr{display:inline-block;padding:2px 9px;border-radius:4px;font-size:13px;font-weight:700;color:#fff;letter-spacing:.02em}
.abbr.hot{background:var(--hot)}.abbr.cold{background:var(--cold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;line-height:1.3;border:1.5px solid transparent}
.chip.yaku{background:transparent;border-color:var(--line);color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.seg{display:flex;background:var(--surface);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;font-size:13px;font-weight:700;color:var(--muted);border-left:2px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--brand);color:#111111;font-weight:900}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:6px;font-weight:900;font-size:15px;background:var(--btn);color:var(--btn-fg);border:2px solid var(--ink);min-height:48px}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--ink)}
.btn.ok{background:var(--ok);color:#fff}.btn.ng{background:var(--ng);color:#fff}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{align-self:center;font-size:13px;color:var(--muted);text-decoration:underline;padding:6px}
.row{display:flex;gap:10px}.row .btn{flex:1}.row .search{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:11px 14px;border-radius:6px;border:2px solid var(--ink);background:var(--surface);color:var(--fg);font-size:16px}
.group-title{font-family:var(--font-display);font-weight:400;font-size:18px;margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.group-title .note{font-family:var(--font-body);font-size:11px;font-weight:900;background:var(--ink);color:var(--brand);padding:2px 8px;border-radius:3px}
.group-title::after{content:"";flex:1;height:2px;background:var(--ink)}
.item{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:14px 14px 13px;display:flex;flex-direction:column;gap:9px;position:relative}
.item .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .name{font-weight:900;font-size:18px;letter-spacing:.01em;margin-right:auto}
.item .done{font-size:11px;font-weight:900;background:var(--brand);color:#111111;border:1.5px solid var(--ink);padding:1px 8px;border-radius:999px}
.item .abbrs{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.login{background:var(--surface);border:2px solid var(--ink);border-radius:6px;box-shadow:var(--shadow);padding:24px 20px;display:flex;flex-direction:column;gap:14px;margin-top:10px;margin-right:6px}
.login .big{font-weight:900;font-size:21px;line-height:1.3}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:6px;box-shadow:var(--shadow);min-height:320px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;cursor:pointer;margin-right:6px}
.card.flipped{box-shadow:6px 6px 0 var(--ok)}
.card .cat{font-size:12px;color:var(--muted);letter-spacing:.1em}
.card .big{font-weight:900;font-size:30px;line-height:1.25;text-wrap:balance}
.card .hint{margin-top:auto;text-align:center;color:var(--muted);font-size:13px}
.card .ans .chip{font-size:16px;padding:7px 14px}
.card .ans{display:flex;flex-direction:column;gap:10px}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:2px solid var(--ink);border-radius:6px;box-shadow:var(--shadow);padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-right:6px}
.q .ask{font-size:13px;color:var(--muted)}
.q .target{font-weight:900;font-size:26px;line-height:1.3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q .target .abbr{font-family:var(--font-body);font-size:22px;padding:4px 14px;border-radius:6px}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{padding:9px 13px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;min-height:40px}
.pick button.sel{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.pick button.c-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.pick button.c-miss{background:var(--warn-soft);border-color:var(--warn);border-style:dashed;color:var(--fg)}
.pick button.c-extra{background:var(--ng-soft);border-color:var(--ng);color:var(--fg);text-decoration:line-through}
.pick button.c-none{opacity:.45}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;padding:13px 14px;border-radius:6px;border:2px solid var(--ink);background:var(--surface);font-size:16px;font-weight:700;min-height:50px}
.choices button.c-ok{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.choices button.c-ng{background:var(--ng-soft);border-color:var(--ng)}
.verdict{border-radius:6px;border:2px solid var(--ink);padding:12px 14px;font-weight:900;display:flex;flex-direction:column;gap:4px}
.verdict.good{background:var(--ok-soft);color:var(--ok)}.verdict.bad{background:var(--ng-soft);color:var(--ng)}
.verdict small{font-weight:500;color:var(--fg);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid}
.legend .l-ok i{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-miss i{background:var(--warn-soft);border-color:var(--warn);border-style:dashed}
.legend .l-extra i{background:var(--ng-soft);border-color:var(--ng)}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--ok)}
.score{text-align:center;padding:26px 0 10px}
.score .n{font-weight:900;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score .n small{font-size:22px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:12px 10px;text-align:center}
.tile b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:2px solid var(--ink);border-radius:6px;overflow:hidden;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:700}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.low i{background:var(--ng)}.bar.mid i{background:var(--warn)}
.note{font-size:12px;color:var(--muted)}
.photo{display:block;width:100%;max-width:340px;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:2px solid var(--ink);background:var(--surface-2)}
.photo-row{display:flex;gap:14px;align-items:flex-start}
.photo-row .photo{width:150px;flex:none}
.photo-row .verdict{flex:1;min-width:0}
.sync{font-size:12px;color:var(--muted);min-height:1em}
.sync.err{color:var(--ng);font-weight:700}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:8px 10px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);font-size:13px}
.hrow .mark{font-weight:800}.hrow .mark.ok{color:var(--ok)}.hrow .mark.ng{color:var(--ng)}
.hrow .t{color:var(--muted);font-size:11px}
.person{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.person .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.person .pn{font-weight:700;font-size:16px;margin-right:auto}
.person .pm{display:flex;gap:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.person .pm b{color:var(--fg);font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:3px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs .in{gap:6px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:6px;border:2px solid transparent;color:var(--muted);font-size:11px;font-weight:700}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:#111111;background:var(--brand);border-color:var(--ink);font-weight:900}
</style>

// ===== サーバー（GAS）通信 =====

const API_URL='https://script.google.com/macros/s/AKfycbwTt70dZlCIa-nI68YQyu8htaftonydwlEXjSgETu4Mtcw_yvbHRTu9r5eZCzKRphqp/exec';

function inGas(){return (typeof google!=='undefined')&&!!google.script&&!!google.script.run;}
function isDemoHost(){return /(^|\.)claude\.ai$|claudeusercontent|anthropic/.test(location.hostname);}
function useApi(){return !inGas()&&/^https?:$/.test(location.protocol)&&!isDemoHost();}
function hasGas(){return inGas()||useApi();}
function rpc(fn){const args=[].slice.call(arguments,1);
  if(inGas())return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args);});
  if(!useApi())return Promise.reject(new Error('offline'));
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const t=ctl?setTimeout(()=>ctl.abort(),25000):null;
  return fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),signal:ctl?ctl.signal:undefined})
    .then(r=>{if(!r.ok)throw new Error('通信エラー（'+r.status+'）');return r.text();})
    .then(tx=>{let j;try{j=JSON.parse(tx);}catch(e){throw new Error('サーバーの応答を読めませんでした');}
      if(!j.ok)throw new Error(j.error||'エラーが発生しました');return j.result;})
    .catch(e=>{if(e&&e.name==='AbortError')throw new Error('通信がタイムアウトしました。電波の良い所でもう一度');
      if(e&&e.name==='TypeError')throw new Error('通信できませんでした。電波を確認してもう一度');throw e;})
    .finally(()=>{if(t)clearTimeout(t);});}
const errMsg=e=>String((e&&e.message)||e||'').replace(/^(Error|ScriptError):\s*/,'');

function weight(v){const s=stat(v.key);return 1+s.ng*1.5/(s.ok+1)+(S.learned[v.id]?0:0.5);}
function pickWeighted(list,excludeKey){const c=list.filter(v=>v.key!==excludeKey);let sum=0;const w=c.map(v=>{const x=weight(v);sum+=x;return x;});let r=Math.random()*sum;for(let i=0;i<c.length;i++){r-=w[i];if(r<=0)return c[i];}return c[c.length-1];}

function dueList(){const now=Date.now();return VARIANTS.filter(v=>S.srs[v.key]&&S.srs[v.key].due<=now);}

function downloadCsv(list){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['店舗','名前','登録日','最終利用','覚えた数','出題数','正答率','認定合格日','認定最高点']].concat(list.map(u=>[u.store,u.name,u.registered,u.updated,u.learned,u.n,u.n?Math.round(u.ok/u.n*100)+'%':'',u.pass,(u.best||0)+'%']));
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='ふるいちラボ_'+(adminScope==='all'?'全店舗':adminScope)+'_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
function histHtml(rows){if(!rows.length)return '<div class="note">まだ回答がありません</div>';

// ===== クイズ =====
const ROUND=10;
let Q={n:0,score:0,cur:null,sel:new Set(),answered:false,done:false,round:ROUND,queue:null,started:true,miss:[],cert:null};
function modeBtns(){['#qmode','#qmode2'].forEach(id=>$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.m===S.qmode)));
  const rv=$('#qmode2 [data-m="review"]');if(rv){const n=dueList().length;rv.textContent=n?`今日の復習（${n}）`:'今日の復習';}}
['#qmode','#qmode2'].forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.qmode=b.dataset.m;save();resetQuiz();}));
function reviewPool(){const d=dueList();if(d.length)return {list:d,kind:'due'};
  const weak=VARIANTS.filter(v=>{const s=stat(v.key),n=s.ok+s.ng;return n&&s.ok/n<0.7;});return {list:weak,kind:'weak'};}
function resetQuiz(){const m=S.qmode;Q={n:0,score:0,cur:null,sel:new Set(),answered:false,done:false,round:ROUND,queue:null,started:true,miss:[],cert:null};
  if(m==='cert'){Q.queue=shuffle(VARIANTS);Q.round=Q.queue.length;Q.started=false;renderQuiz();return;}
  if(m==='review'){const p=reviewPool();Q.pool=p;if(!p.list.length){Q.round=0;renderQuiz();return;}Q.queue=shuffle(p.list).slice(0,ROUND);Q.round=Q.queue.length;}
  nextQ();}
function ensureQuiz(){modeBtns();if(!Q.cur&&!(Q.queue&&!Q.started))resetQuiz();else renderQuiz();}
function nextQ(){
  if(Q.n>=Q.round){Q.done=true;if(S.qmode==='cert')finishCert();renderQuiz();return;}
  const mode=['review','cert'].includes(S.qmode)?'gu':S.qmode;
  let item;
  if(Q.queue)item=Q.queue[Q.n];
  else{const pool=mode==='abbr'?VARIANTS.filter(v=>v.abbr):VARIANTS;item=pickWeighted(pool,Q.cur?Q.cur.item.key:null);}
  const q={mode,item,choices:[]};
  if(mode!=='gu'){
    let others=MENU.filter(m=>m.id!==item.id);
    if(mode==='name')others=others.filter(m=>!(m.cat===item.cat&&m.temp.includes(item.temp)&&setEq((item.temp==='冷'&&m.topCold)||m.top,item.top)&&setEq((item.temp==='冷'&&m.yakuCold)||m.yaku,item.yaku)));
    const same=shuffle(others.filter(m=>m.cat===item.cat)),diff=shuffle(others.filter(m=>m.cat!==item.cat));
    q.choices=shuffle([byId(item.id),...same.concat(diff).slice(0,3)]);
  }
  Q.cur=q;Q.sel=new Set();Q.answered=false;Q.n++;renderQuiz();
}
function finishCert(){const total=Q.round,score=Q.score,passed=score/total>=PASS_RATE;
  Q.cert={passed,pct:Math.round(score/total*100),saving:hasGas()&&!!S.token,err:''};
  if(passed&&!S.pass)S.pass=new Date().toLocaleDateString('ja-JP');S.best=Math.max(S.best||0,Q.cert.pct);save();
  if(Q.cert.saving)rpc('certResult',S.token,score,total).then(r=>{S.pass=r.pass||S.pass;S.best=r.best||S.best;save();Q.cert.saving=false;if(S.tab==='quiz')renderQuiz();})
    .catch(e=>{Q.cert.saving=false;Q.cert.err=errMsg(e)||'結果を保存できませんでした';if(S.tab==='quiz')renderQuiz();});}
function renderQuiz(){
  modeBtns();
  const box=$('#quiz');
  if(S.qmode==='review'&&Q.round===0){$('#q-pos').textContent='';$('#q-score').textContent='';
    box.innerHTML=`<div class="q"><div class="score"><div class="label">今日の復習</div><div class="n" style="font-size:22px">今日の復習はありません</div>
      <div class="note">間違えた商品は翌日、正解した商品は3日後・1週間後…と、忘れかけた頃にここへ出てきます。</div></div>
      <button class="btn" id="q-go-gu">具材クイズをする</button></div>`;
    $('#q-go-gu').addEventListener('click',()=>{S.qmode='gu';save();resetQuiz();});return;}
  if(S.qmode==='cert'&&!Q.started){$('#q-pos').textContent='';$('#q-score').textContent='';
    box.innerHTML=`<div class="q"><div class="score"><div class="label">認定テスト</div><div class="n" style="font-size:26px">全${Q.round}問</div>
      <div class="note">温・冷を含む全商品の具材と薬味を答えます。<b>${Math.ceil(Q.round*PASS_RATE)}問以上（90%）正解で合格</b>です。合格すると記録に残り、店長も確認できます。所要時間は10分ほどです。</div>
      ${S.pass?`<div class="note" style="color:var(--ok);font-weight:900">合格済み（${esc(S.pass)}）　最高 ${S.best||0}%</div>`:''}</div>
      <button class="btn" id="q-start">はじめる</button></div>`;
    $('#q-start').addEventListener('click',()=>{Q.started=true;nextQ();});return;}
  if(Q.done){$('#q-pos').textContent='';$('#q-score').textContent='';
    const pct=Math.round(Q.score/Q.round*100);
    if(S.qmode==='cert'){const c=Q.cert||{};
      box.innerHTML=`<div class="q"><div class="score"><div class="label">認定テストの結果</div><div class="n">${Q.score}<small> / ${Q.round}</small></div>
        <div class="big" style="color:${c.passed?'var(--ok)':'var(--ng)'}">${c.passed?'合格！':'あと少し'}（${pct}%）</div>
        <div class="note">${c.saving?'結果を保存中…':c.err?esc(c.err):c.passed?'合格が記録されました。':'合格は90%以上です。間違えた商品を「今日の復習」で練習してから、もう一度挑戦してください。'}</div></div>
        ${Q.miss.length?`<div class="label">間違えた商品</div><div class="chips">${Q.miss.map(l=>`<span class="chip" style="background:var(--ng-soft)">${esc(l)}</span>`).join('')}</div>`:''}
        <button class="btn" id="q-again">もう一度受ける</button><button class="btn ghost" id="q-stats">成績を見る</button></div>`;
    }else box.innerHTML=`<div class="q"><div class="score"><div class="label">今回の結果</div><div class="n">${Q.score}<small> / ${Q.round}</small></div><div class="note">${pct===100?'全問正解！':pct>=70?'いい調子。間違えた商品は一覧で確認を':'一覧かカードで見直してからもう一度'}</div></div>
      <button class="btn" id="q-again">もう1ラウンド</button><button class="btn ghost" id="q-stats">成績を見る</button></div>`;
    $('#q-again').addEventListener('click',resetQuiz);$('#q-stats').addEventListener('click',()=>showTab('stats'));return;}
  const q=Q.cur,m=q.item;
  $('#q-pos').textContent=`${S.qmode==='cert'?'認定テスト　':S.qmode==='review'?'復習　':''}第${Q.n}問 / ${Q.round}問`;$('#q-score').textContent=`正解 ${Q.score}`;
  let html='';
  if(q.mode==='gu'){
    const yk=S.withYaku||S.qmode==='cert';const correct=yk?m.top.concat(m.yaku):m.top;
    const cls=t=>{if(!Q.answered)return Q.sel.has(t)?'sel':'';const c=correct.includes(t),s=Q.sel.has(t);return c&&s?'c-ok':c?'c-miss':s?'c-extra':'c-none';};
    html=`<div class="q"><div class="ask">${CAT_LABEL[m.cat]}タイプ　この商品に乗っている具材をすべて選んでください</div>
      <div class="target">${tempBadge(m.temp)}${esc(m.name)}</div>
      <div class="label">具材</div><div class="pick" id="pick">${ALL_TOP.map(t=>`<button data-t="${esc(t)}" class="${cls(t)}">${esc(t)}</button>`).join('')}</div>
      ${yk?`<div class="label">薬味（別添え）</div><div class="pick" id="pick-y">${YAKU.map(t=>`<button data-t="${esc(t)}" class="${cls(t)}">${esc(t)}</button>`).join('')}</div>`:''}
      ${Q.answered?verdictGu(m,correct):`${S.qmode==='cert'?'':`<label class="opt"><input type="checkbox" id="opt-yaku" ${S.withYaku?'checked':''}> 薬味も採点する</label>`}
        <button class="btn" id="q-check" ${Q.sel.size?'':'disabled'}>答え合わせ（${Q.sel.size}個選択）</button>`}
      ${Q.answered?`<button class="btn" id="q-next">次へ</button>`:''}</div>`;
  }else{
    const ask=q.mode==='name'
      ?`<div class="ask">${CAT_LABEL[m.cat]}タイプ ${tempBadge(m.temp)}　この具材の商品は？</div><div class="chips">${topChips(m,true)}</div>`
      :`<div class="ask">この略称の商品は？</div><div class="target"><span class="abbr ${m.temp==='温'?'hot':'cold'}">${esc(m.abbr)}</span></div>`;
    html=`<div class="q">${ask}<div class="choices" id="choices">${q.choices.map(c=>{let k='';if(Q.answered){if(c.id===m.id)k='c-ok';else if(Q.sel.has(c.id))k='c-ng';}
      return `<button data-id="${c.id}" class="${k}">${esc(c.name)}</button>`;}).join('')}</div>
      ${Q.answered?`<div class="photo-row">${photoImg(m)}<div class="verdict ${Q.sel.has(m.id)?'good':'bad'}">${Q.sel.has(m.id)?'正解！':'不正解'}<small>${esc(m.label)}：${m.top.join('・')}${m.yaku.length?'（薬味：'+m.yaku.join('・')+'）':''}</small></div></div><button class="btn" id="q-next">次へ</button>`:''}</div>`;
  }
  box.innerHTML=html;
  box.querySelectorAll('.pick button').forEach(b=>b.addEventListener('click',()=>{if(Q.answered)return;const t=b.dataset.t;Q.sel.has(t)?Q.sel.delete(t):Q.sel.add(t);renderQuiz();}));
  const oy=$('#opt-yaku');if(oy)oy.addEventListener('change',()=>{S.withYaku=oy.checked;save();renderQuiz();});
  const chk=$('#q-check');if(chk)chk.addEventListener('click',()=>{const correct=(S.withYaku||S.qmode==='cert')?m.top.concat(m.yaku):m.top;const ok=setEq([...Q.sel],correct);Q.answered=true;if(ok)Q.score++;else Q.miss.push(m.label);
    const miss=correct.filter(t=>!Q.sel.has(t)),extra=[...Q.sel].filter(t=>!correct.includes(t));
    record(m.key,ok,{mode:MODE_LABEL[S.qmode==='review'||S.qmode==='cert'?S.qmode:'gu'],miss:miss.join('・'),extra:extra.join('・'),chosen:[...Q.sel].join('・')});renderQuiz();});
  box.querySelectorAll('.choices button').forEach(b=>b.addEventListener('click',()=>{if(Q.answered)return;const id=+b.dataset.id;Q.sel.add(id);Q.answered=true;const ok=id===m.id;if(ok)Q.score++;
    record(m.key,ok,{mode:MODE_LABEL[q.mode]+(q.mode==='abbr'?'（'+m.abbr+'）':''),chosen:byId(id).name});renderQuiz();}));
  const nx=$('#q-next');if(nx)nx.addEventListener('click',nextQ);
}
function verdictGu(m,correct){
  const miss=correct.filter(t=>!Q.sel.has(t)),extra=[...Q.sel].filter(t=>!correct.includes(t));
  const good=!miss.length&&!extra.length;
  return `<div class="photo-row">${photoImg(m)}<div class="verdict ${good?'good':'bad'}">${good?'正解！':'惜しい'}
    ${miss.length?`<small>足りない：${miss.join('・')}</small>`:''}${extra.length?`<small>余分：${extra.join('・')}</small>`:''}<small>${esc(m.label)}：${m.top.join('・')}</small></div></div>
    <div class="legend"><span class="l-ok"><i></i>正解</span><span class="l-miss"><i></i>選び忘れ</span><span class="l-extra"><i></i>余分に選んだ</span></div>`;
}

// ===== 成績（本人） =====
let resetArmed=false;
function renderStats(){
  const rows=VARIANTS.map(v=>{const s=stat(v.key);const n=s.ok+s.ng;return {m:v,s,n,acc:n?s.ok/n:null};});
  const tried=rows.filter(r=>r.n);
  const totalOk=tried.reduce((a,r)=>a+r.s.ok,0),totalN=tried.reduce((a,r)=>a+r.n,0);
  const learned=Object.values(S.learned).filter(Boolean).length;
  const weak=rows.filter(r=>r.n&&r.acc<0.7).sort((a,b)=>a.acc-b.acc);
  const sorted=rows.slice().sort((a,b)=>{if(a.n&&!b.n)return -1;if(!a.n&&b.n)return 1;return (a.acc??1)-(b.acc??1)||b.n-a.n;});
  $('#stats').innerHTML=`
    <div class="label">${esc(S.store?S.store+'　':'')}${esc(S.user||'')} さんの記録</div>
    <div class="tiles"><div class="tile"><b>${learned}<span style="font-size:13px">/${MENU.length}</span></b><span>覚えた</span></div>
      <div class="tile"><b>${totalN}</b><span>出題数</span></div>
      <div class="tile"><b>${totalN?Math.round(totalOk/totalN*100):'–'}<span style="font-size:13px">${totalN?'%':''}</span></b><span>正答率</span></div></div>
    <div class="person"><div class="ph"><span class="pn">認定テスト</span>${S.pass?`<span class="done" style="color:var(--ok);font-weight:900">✓ 合格（${esc(S.pass)}）</span>`:'<span class="note">未合格</span>'}</div>
      <div class="pm"><span>最高 <b>${S.best||0}%</b></span><span>合格ライン <b>90%</b></span><span>今日の復習 <b>${dueList().length}</b>品</span></div>
      <div class="row"><button class="btn ghost sm" id="go-review">今日の復習をする</button><button class="btn ghost sm" id="go-cert">認定テストを受ける</button></div></div>
    ${weak.length?`<div><div class="label" style="margin-bottom:6px">苦手な商品（正答率70%未満）</div><div class="chips">${weak.map(r=>`<span class="chip" style="background:var(--ng-soft)">${esc(r.m.label)} ${Math.round(r.acc*100)}%</span>`).join('')}</div></div>`:''}
    <div style="overflow-x:auto"><table><thead><tr><th>商品</th><th>正答率</th><th style="text-align:right">正解/出題</th></tr></thead><tbody>
      ${sorted.map(r=>{const p=r.acc==null?null:Math.round(r.acc*100);const cls=p==null?'':p<50?'low':p<80?'mid':'';
        return `<tr><td>${tempBadge(r.m.temp)} ${esc(r.m.name)}${S.learned[r.m.id]?' <span class="done" style="font-size:11px;color:var(--ok)">✓</span>':''}</td><td><div class="bar ${cls}"><i style="width:${p??0}%"></i></div></td><td class="num">${r.n?`${r.s.ok} / ${r.n}`:'未出題'}</td></tr>`;}).join('')}
    </tbody></table></div>
    ${hasGas()?`<button class="btn ghost" id="myhist">自分の回答履歴を見る</button><div class="hist" id="myhist-box" hidden></div>`:''}
    <p class="note">クイズは苦手な商品ほど出やすくなります。間違えた商品は翌日、覚えた商品は数日後に「今日の復習」へ出てきます。${hasGas()?'記録は本人と管理者だけが見られます。':'記録はこの端末のブラウザ内にだけ保存されます。'}</p>
    <button class="btn ghost" id="reset">${resetArmed?'本当にリセットする（もう一度タップ）':'自分の記録をリセット'}</button>`;
  $('#go-review').addEventListener('click',()=>{S.qmode='review';save();Q.cur=null;Q.queue=null;showTab('quiz');});
  $('#go-cert').addEventListener('click',()=>{S.qmode='cert';save();Q.cur=null;Q.queue=null;showTab('quiz');});
  $('#reset').addEventListener('click',()=>{if(!resetArmed){resetArmed=true;renderStats();setTimeout(()=>{resetArmed=false;if(S.tab==='stats')renderStats();},4000);return;}
    S.learned={};S.stats={};S.srs={};save();pushState();resetArmed=false;deck=[];Q.cur=null;renderStats();});
  const mh=$('#myhist');if(mh)mh.addEventListener('click',()=>{const hb=$('#myhist-box');if(!hb.hidden){hb.hidden=true;mh.textContent='自分の回答履歴を見る';return;}
    mh.disabled=true;mh.textContent='読み込み中…';
    rpc('myHistory',S.token,50).then(rows=>{mh.disabled=false;mh.textContent='履歴を閉じる';hb.hidden=false;hb.innerHTML=histHtml(rows);})
      .catch(e=>{mh.disabled=false;mh.textContent='読み込めませんでした。もう一度';});});
}

// ===== 起動 =====
$('#filter').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.f===S.filter));
hideAll();
$('#s-login').hidden=false;$('#login-box').hidden=false;$('#login-status').textContent='読み込み中…';
loadCachedMenu();
function boot(){
  if(inGas()&&PAGE_URL)showMoveBanner();
  if(hasGas()){
    refreshMenu();
    if(S.token){$('#login-status').textContent='前回の記録を読み込み中…';
      rpc('resume',S.token).then(r=>{applyUser(r);save();if(STORE_ENABLED&&!S.store)askStore();else enter();})
        .catch(()=>{S.token='';save();showLogin('もう一度ログインしてください');});}
    else showLogin();
    return;
  }
  if(S.user){if(STORE_ENABLED&&!S.store)askStore();else enter();}else showLogin();
}
function showMoveBanner(){const d=document.createElement('div');d.className='move-banner';
  d.innerHTML='<b>新しいアドレスに移りました</b><span>こちらの方が確実に開けます。開いたら「ホーム画面に追加」をやり直してください。</span><a href="'+PAGE_URL+'" target="_top">新しいアドレスで開く</a>';
  document.body.insertBefore(d,document.body.firstChild);}
if(useApi())boot();else (function wait(n){if(inGas()||n<=0)boot();else setTimeout(()=>wait(n-1),100);})(30);
</script>

</body></html>
